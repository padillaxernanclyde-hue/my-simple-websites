<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Simple Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: lightblue;
            transition: 0.3s;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: darkblue;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: darkblue;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #clock {
            margin: 15px;
            font-weight: bold;
        }

        #counter {
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        /* Dark mode */
        .dark {
            background-color: #222;
            color: white;
        }

        .dark .container {
            background-color: #333;
        }

        .dark h1 {
            color: lightblue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Website</h1>

        <p>Welcome to my simple website!</p>

        <!-- Date and time -->
        <div id="clock"></div>

        <!-- Name and message -->
        <input type="text" id="name" placeholder="Enter your name">

        <textarea id="message" placeholder="Enter your message"></textarea>

        <br>

        <button onclick="displayOutput()">Submit</button>
        <button onclick="clearOutput()">Clear</button>

        <p id="output">Your message will appear here.</p>

        <!-- Counter -->
        <p>Button clicked:</p>
        <div id="counter">0</div>

        <button onclick="increaseCounter()">Click Me!</button>

        <br>

        <!-- Dark mode -->
        <button onclick="darkMode()">🌙 Dark Mode</button>

    </div>

    <script>

        // Display name and message
        function displayOutput() {

            let name = document.getElementById("name").value;
            let message = document.getElementById("message").value;

            if (name === "" || message === "") {

                document.getElementById("output").textContent =
                    "Please enter your name and message.";

            } else {

                document.getElementById("output").textContent =
                    "Hello, " + name + "! Your message is: " + message;
            }
        }


        // Clear everything
        function clearOutput() {

            document.getElementById("name").value = "";
            document.getElementById("message").value = "";

            document.getElementById("output").textContent =
                "Your message will appear here.";
        }


        // Counter
        let count = 0;

        function increaseCounter() {

            count++;

            document.getElementById("counter").textContent = count;
        }


        // Dark mode
        function darkMode() {

            document.body.classList.toggle("dark");
        }


        // Clock
        function updateClock() {

            let now = new Date();

            document.getElementById("clock").textContent =
                now.toLocaleString();
        }

        setInterval(updateClock, 1000);

        updateClock();

    </script>

</body>
</html>
